---
name: "Checkin"
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: "Setup node"
        uses: actions/setup-node@v6
        with:
          node-version: "latest"

      - name: "npm ci"
        run: npm ci

      - name: "lint"
        run: npm run lint

      - name: "test"
        run: npm test

      - name: "build"
        run: npm run build
