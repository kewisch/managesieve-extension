<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="extensionName"></title>
    <link rel="stylesheet" href="manage.css">
    <script type="module" src="manage.mjs"></script>
  </head>
  <body>
    <main class="settings-shell">
      <aside class="sidebar" aria-labelledby="sidebarTitle">
        <div class="sidebar-header">
          <h1 id="sidebarTitle" data-i18n="extensionShortName"></h1>
          <div class="sidebar-header-actions">
            <button id="addServerButton" type="button" data-i18n-title="addServerManually" class="icon-button">+</button>
            <button id="refreshAccountsButton" type="button" data-i18n-title="refreshAccounts" class="icon-button">↻</button>
          </div>
        </div>
        <nav id="accountSidebar" class="account-sidebar"></nav>
      </aside>
      <section class="content-area">
        <section id="welcomeBanner" class="welcome-banner" aria-labelledby="welcomeBannerTitle" hidden>
          <h2 id="welcomeBannerTitle" data-i18n="welcomeBannerTitle"></h2>
          <p data-i18n="welcomeBannerMessage"></p>
          <p data-i18n="welcomeBannerGettingStartedMessage"></p>
          <p data-i18n="welcomeBannerReturnMessage"></p>
        </section>
        <div id="contentArea" aria-live="polite"></div>
      </section>
    </main>
  </body>
</html>
